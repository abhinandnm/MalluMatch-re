<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Temporary Maintenance</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 30px;
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .emoji {
            font-size: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji"></div>
        <h1>We'll Be Back Soon!</h1>
        <p>
            Our platform is currently undergoing maintenance and infrastructure upgrades.
        </p>
        <p>
            The service may be temporarily unavailable, but we're working hard to bring it back
            as soon as possible with improvements and a better experience.
        </p>
        <p>
            Thank you for your patience and support. 
            
        </p>
    </div>
</body>
</html>
